name: Android validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_DEPENDENCY_VERIFICATION_ARGS: >-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && '--refresh-dependencies --write-verification-metadata sha256' || '' }}

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit tests, lint and debug build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install Android compile SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Run unit tests, lint and debug build
        run: >-
          ./gradlew $GRADLE_DEPENDENCY_VERIFICATION_ARGS
          testDebugUnitTest assembleDebug lintDebug --no-daemon --no-parallel

      - name: Report updated dependency checksums
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "Gradle verification metadata is already up to date."
          else
            echo "::warning file=gradle/verification-metadata.xml::Dependabot resolved new artifacts. Review and commit the generated SHA-256 metadata before merging."
          fi

      - name: Upload generated dependency checksums
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-verification-metadata-${{ github.run_attempt }}
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 14

  device-smoke:
    name: Install and run on Android emulator
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install Android compile SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and exercise the debug application
        run: |
          ./gradlew $GRADLE_DEPENDENCY_VERIFICATION_ARGS \
            pixel2Api35DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            --no-daemon --no-parallel

      - name: Upload emulator test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-emulator-test-results-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn
          retention-days: 14
