name: OSV dependency security report

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "43 04 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_DEPENDENCY_VERIFICATION_ARGS: >-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && '--write-verification-metadata sha256' || '' }}

jobs:
  osv:
    name: Scan runtime SBOM with OSV
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Android compile SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Generate runtime SBOM
        run: >-
          ./gradlew $GRADLE_DEPENDENCY_VERIFICATION_ARGS
          :app:cyclonedxDirectBom --no-daemon --no-parallel

      - name: Scan SBOM and create public reports
        id: osv
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/run_osv_security_report.ps1 `
            -SbomPath app/build/reports/cyclonedx-direct/bom.json `
            -OutputDirectory security-output `
            -ProjectVersion '${{ github.ref_name }}' `
            -CommitSha '${{ github.sha }}'

      - name: Upload OSV results to GitHub Security
        if: >-
          always() &&
          hashFiles('security-output/osv-results.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: security-output/osv-results.sarif
          category: osv-runtime-dependencies

      - name: Publish security report artifact
        if: always() && hashFiles('security-output/security-report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-security-report
          path: security-output
          if-no-files-found: error

      - name: Enforce OSV result
        if: steps.osv.outcome == 'failure'
        run: |
          echo "::error::Known vulnerability detected or OSV analysis failed"
          exit 1
