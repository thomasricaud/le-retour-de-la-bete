name: Build and publish Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: Test, sign and package APK
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install Android compile SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore Android signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          if [[ -z "$SIGNING_KEY_BASE64" ]]; then
            echo "::error::ANDROID_SIGNING_KEY_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/retour-bete-release.jks"

      - name: Run tests, lint and release build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/retour-bete-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version_args=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version_name="${GITHUB_REF_NAME#v}"
            if [[ ! "$version_name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Release tags must use vMAJOR.MINOR.PATCH (received $GITHUB_REF_NAME)"
              exit 1
            fi
            major=$((10#${BASH_REMATCH[1]}))
            minor=$((10#${BASH_REMATCH[2]}))
            patch=$((10#${BASH_REMATCH[3]}))
            if (( minor > 999 || patch > 999 )); then
              echo "::error::MINOR and PATCH must remain between 0 and 999"
              exit 1
            fi
            version_code=$((major * 1000000 + minor * 1000 + patch))
            if (( version_code < 1 || version_code > 2100000000 )); then
              echo "::error::Computed Android versionCode is outside the supported range"
              exit 1
            fi
            version_args+=(
              "-PappVersionName=$version_name"
              "-PappVersionCode=$version_code"
            )
          fi
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease \
            pixel2Api35DebugAndroidTest \
            :app:cyclonedxDirectBom \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            "${version_args[@]}" --no-daemon --no-parallel

      - name: Upload failed emulator test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-release-emulator-test-results-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Prepare downloadable files
        id: release_metadata
        shell: bash
        run: |
          mkdir -p public-download
          cp app/build/outputs/apk/release/app-release.apk \
            public-download/le-retour-de-la-bete.apk
          cp app/build/reports/cyclonedx-direct/bom.json \
            public-download/le-retour-de-la-bete.cdx.json
          cp distribution/index.html public-download/index.html
          cp app/src/main/res/drawable-nodpi/app_emblem.webp \
            public-download/app_emblem.webp
          cp app/src/main/res/drawable-nodpi/bg_village_night.webp \
            public-download/bg_village_night.webp
          cp app/src/main/res/drawable-nodpi/bg_village_day.webp \
            public-download/bg_village_day.webp
          cert_fingerprint=$(
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
              --print-certs public-download/le-retour-de-la-bete.apk |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
          )
          if [[ ! "$cert_fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to read the APK signing certificate fingerprint"
            exit 1
          fi
          expected_fingerprint=$(
            tr -d '[:space:]' < \
              distribution/release-signing-certificate.sha256
          )
          if [[ "$cert_fingerprint" != "$expected_fingerprint" ]]; then
            echo "::error::APK signing certificate differs from installed releases"
            exit 1
          fi
          printf '%s\n' "$cert_fingerprint" > \
            public-download/le-retour-de-la-bete.apk.cert.sha256
          cd public-download
          sha256sum le-retour-de-la-bete.apk > le-retour-de-la-bete.apk.sha256
          apk_sha256=$(cut -d ' ' -f 1 le-retour-de-la-bete.apk.sha256)
          version_name=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
              le-retour-de-la-bete.apk |
              sed -n "s/.*versionName='\([^']*\)'.*/\1/p"
          )
          if [[ -z "$version_name" ]]; then
            echo "::error::Unable to read the APK version"
            exit 1
          fi
          printf 'apk_sha256=%s\n' "$apk_sha256" >> "$GITHUB_OUTPUT"
          printf 'certificate_sha256=%s\n' "$cert_fingerprint" >> "$GITHUB_OUTPUT"
          printf 'version_name=%s\n' "$version_name" >> "$GITHUB_OUTPUT"

      - name: Validate SBOM
        run: |
          jq -e '
            .bomFormat == "CycloneDX" and
            .specVersion == "1.6" and
            (.components | length > 0)
          ' public-download/le-retour-de-la-bete.cdx.json

      - name: Scan SBOM with OSV and create public reports
        id: osv
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/run_osv_security_report.ps1 `
            -SbomPath public-download/le-retour-de-la-bete.cdx.json `
            -OutputDirectory public-download `
            -ProjectVersion '${{ steps.release_metadata.outputs.version_name }}' `
            -CommitSha '${{ github.sha }}' `
            -ApkSha256 '${{ steps.release_metadata.outputs.apk_sha256 }}' `
            -CertificateSha256 '${{ steps.release_metadata.outputs.certificate_sha256 }}'

      - name: Upload OSV results to GitHub Security
        if: always() && hashFiles('public-download/osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: public-download/osv-results.sarif
          category: osv-release-runtime-dependencies

      - name: Enforce OSV result
        if: steps.osv.outcome == 'failure'
        run: |
          echo "::error::Known vulnerability detected or OSV analysis failed"
          exit 1

      - name: Attest APK build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: public-download/le-retour-de-la-bete.apk

      - name: Attest APK SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: public-download/le-retour-de-la-bete.apk
          sbom-path: public-download/le-retour-de-la-bete.cdx.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: le-retour-de-la-bete-apk
          path: |
            public-download/le-retour-de-la-bete.apk
            public-download/le-retour-de-la-bete.apk.sha256
            public-download/le-retour-de-la-bete.apk.cert.sha256
            public-download/le-retour-de-la-bete.cdx.json
            public-download/security-report.md
            public-download/security-report.json
            public-download/osv-results.json
            public-download/osv-results.sarif
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public-download

  release:
    name: Publish immutable release assets
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: le-retour-de-la-bete-apk
          path: public-download

      - name: Create or verify GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            le-retour-de-la-bete.apk
            le-retour-de-la-bete.apk.sha256
            le-retour-de-la-bete.apk.cert.sha256
            le-retour-de-la-bete.cdx.json
            security-report.md
            security-report.json
            osv-results.json
            osv-results.sarif
          )

          if release_state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$release_state" == "true" ]]; then
              gh release upload "$GITHUB_REF_NAME" \
                "${assets[@]/#/public-download/}" --clobber
              gh release edit "$GITHUB_REF_NAME" --draft=false
            else
              mkdir released-assets
              gh release download "$GITHUB_REF_NAME" \
                --dir released-assets
              for asset in "${assets[@]}"; do
                cmp --silent \
                  "public-download/$asset" \
                  "released-assets/$asset" || {
                    echo "::error::Published asset differs: $asset"
                    exit 1
                  }
              done
              echo "Published immutable assets already match this build."
            fi
          else
            release_notes_args=(--generate-notes)
            notes_file="docs/releases/${GITHUB_REF_NAME}.md"
            if [[ -f "$notes_file" ]]; then
              release_notes_args=(--notes-file "$notes_file")
            fi
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              "${release_notes_args[@]}" \
              --title "Le Retour de la Bête ${GITHUB_REF_NAME}"
            gh release upload "$GITHUB_REF_NAME" \
              "${assets[@]/#/public-download/}"
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi

  deploy:
    name: Publish public download page
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy APK download page
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
