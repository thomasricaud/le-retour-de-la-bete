name: CodeQL security analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 04 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_DEPENDENCY_VERIFICATION_ARGS: >-
    ${{ github.actor == 'dependabot[bot]' && '--write-verification-metadata sha256' || '' }}

jobs:
  analyze:
    name: Analyze Kotlin and Java
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Android compile SDK
        run: sdkmanager "platforms;android-37.0"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build analyzed application
        run: >-
          ./gradlew $GRADLE_DEPENDENCY_VERIFICATION_ARGS
          :app:assembleDebug --no-daemon --no-parallel

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:java-kotlin
