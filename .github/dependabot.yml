version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      android-build-stack:
        patterns:
          - "com.android.application"
          - "gradle-wrapper"
          - "org.jetbrains.kotlin.*"
          - "androidx.compose:*"
          - "androidx.lifecycle:*"
      androidx-foundation:
        patterns:
          - "androidx.core:*"
          - "androidx.activity:*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
      android-build-actions:
        patterns:
          - "actions/setup-java"
          - "gradle/actions/*"
      artifact-actions:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
      pages-actions:
        patterns:
          - "actions/upload-pages-artifact"
          - "actions/deploy-pages"
